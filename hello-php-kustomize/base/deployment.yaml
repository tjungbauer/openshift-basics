apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-php
  labels:
    app: hello-php
spec:
  replicas: 1                       # overridden per environment
  selector:
    matchLabels:
      app: hello-php
  template:
    metadata:
      labels:
        app: hello-php
    spec:
      containers:
        - name: hello-php
          image: quay.io/your-org/hello-php:1.0.0   # tag overridden per environment
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /opt/app-root/config   # index.php reads app.ini from here
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hello-php-config   # generated per environment, Kustomize adds the hash suffix
